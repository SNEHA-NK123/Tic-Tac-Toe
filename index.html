<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <link rel="stylesheet" href="./TicTacToe.css">
</head>

<body>
    <h1>Tic Tac Toe</h1>
    <div class="board">
        <button class="box" id="sq1"></button>
        <button class="box" id="sq2"></button>
        <button class="box" id="sq3"></button>

        <button class="box" id="sq4"></button>
        <button class="box" id="sq5"></button>
        <button class="box" id="sq6"></button>

        <button class="box" id="sq7"></button>
        <button class="box" id="sq8"></button>
        <button class="box" id="sq9"></button>
    </div>

    <div class="message">
        X's turn
    </div>

    <button class="restart" id="reset-btn">
        Reset
    </button>

    <script src="./TicTacToe.js"></script>
</body>

</html>
